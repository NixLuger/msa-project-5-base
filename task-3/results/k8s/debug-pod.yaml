apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: task3
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: exports
          mountPath: /data
  volumes:
    - name: exports
      persistentVolumeClaim:
        claimName: export-pvc
