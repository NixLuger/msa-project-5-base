apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipments-export
  namespace: task3
  labels:
    app: shipments-export
spec:
  schedule: "0 20 * * *"
  timeZone: "Europe/Moscow"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: shipments-export
        spec:
          restartPolicy: OnFailure
          containers:
            - name: exporter
              image: shipments-export:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: EXPORT_TABLE
                  value: shipments
                - name: OUTPUT_DIR
                  value: /data/exports
              volumeMounts:
                - name: exports
                  mountPath: /data/exports
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
          volumes:
            - name: exports
              persistentVolumeClaim:
                claimName: export-pvc
