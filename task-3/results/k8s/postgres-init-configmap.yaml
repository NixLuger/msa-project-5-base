apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: task3
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS shipments (
        id            BIGSERIAL PRIMARY KEY,
        client_id     INT NOT NULL,
        driver_id     INT NOT NULL,
        vehicle_id    INT NOT NULL,
        origin        TEXT NOT NULL,
        destination   TEXT NOT NULL,
        status        TEXT NOT NULL,
        created_at    TIMESTAMPTZ NOT NULL,
        delivered_at  TIMESTAMPTZ,
        price         NUMERIC(10,2) NOT NULL
    );

    INSERT INTO shipments (client_id, driver_id, vehicle_id, origin, destination, status, created_at, delivered_at, price)
    SELECT
        (random() * 49999 + 1)::int,
        (random() * 4999  + 1)::int,
        (random() * 1999  + 1)::int,
        'City ' || (random() * 50)::int,
        'City ' || (random() * 50)::int,
        (ARRAY['created','in_transit','delivered','cancelled'])[floor(random()*4 + 1)],
        now() - (random() * interval '30 days'),
        CASE WHEN random() < 0.7 THEN now() - (random() * interval '20 days') END,
        (random() * 10000 + 100)::numeric(10,2)
    FROM generate_series(1, 50000);
